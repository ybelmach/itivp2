# Продакшен на собственной виртуальной машине: PostgreSQL + API + nginx со статикой + Caddy (HTTPS).
# Запуск: cd deploy && cp .env.example .env && docker compose up -d --build
# Варианты: своя VM (COMPOSE_PROFILES=standalone) или сервер с общим Caddy
# (COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml), см. .env.example
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-study_materials}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study}"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ../server
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Если DATABASE_URL в .env не задан, используется локальный контейнер db
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-study}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-study_materials}}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      APP_RELEASE: ${APP_RELEASE:-dev}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../client
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_RELEASE: ${APP_RELEASE:-dev}
    restart: unless-stopped
    depends_on:
      - api

  # Caddy сам получает и продлевает сертификат Let's Encrypt для DOMAIN.
  # Запускается только с профилем standalone (COMPOSE_PROFILES=standalone) — на чистой VM.
  # Если на сервере уже есть общий Caddy, используется docker-compose.proxy.yml.
  caddy:
    profiles: [standalone]
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
