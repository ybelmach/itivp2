# Статика React-приложения + прокси /api на бэкенд (один домен, cookie остаётся first-party)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:3000/health;
  }

  # Файлы с хешем в имени можно кэшировать надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: все остальные пути отдают index.html, маршрут разбирает React Router
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
